name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        node: [22, 24]
        ceph: [squid, tentacle]
        arch: [x64, arm64]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-22.04' }}
    container:
      image: ubuntu:22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Node and Ceph client headers
        run: |
          apt-get update && apt-get install -y ca-certificates curl gnupg g++ make python3
          mkdir -p /etc/apt/keyrings
          curl -fsSL https://download.ceph.com/keys/release.asc | gpg --dearmor -o /etc/apt/keyrings/ceph.gpg
          echo "deb [signed-by=/etc/apt/keyrings/ceph.gpg] https://download.ceph.com/debian-${{ matrix.ceph }}/ jammy main" > /etc/apt/sources.list.d/ceph.list
          curl -fsSL https://deb.nodesource.com/setup_${{ matrix.node }}.x | bash -
          apt-get update && apt-get install -y nodejs librados-dev librbd-dev
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run coverage:api
      - uses: actions/upload-artifact@v4
        if: matrix.node == 24
        with:
          name: addon-${{ matrix.ceph }}-${{ matrix.arch }}
          path: build/Release/node-librados.node

  integration:
    # the integration suite against a disposable single-node cluster in the job container
    strategy:
      fail-fast: false
      matrix:
        ceph: [squid, tentacle]
    runs-on: ubuntu-22.04
    container:
      image: ubuntu:22.04
    timeout-minutes: 20
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v4
      - name: Install Node, Ceph client libraries, monitor and OSD
        run: |
          apt-get update && apt-get install -y ca-certificates curl gnupg g++ make python3 uuid-runtime
          mkdir -p /etc/apt/keyrings
          curl -fsSL https://download.ceph.com/keys/release.asc | gpg --dearmor -o /etc/apt/keyrings/ceph.gpg
          echo "deb [signed-by=/etc/apt/keyrings/ceph.gpg] https://download.ceph.com/debian-${{ matrix.ceph }}/ jammy main" > /etc/apt/sources.list.d/ceph.list
          curl -fsSL https://deb.nodesource.com/setup_24.x | bash -
          apt-get update && apt-get install -y nodejs librados-dev librbd-dev ceph-common ceph-mon ceph-osd
      - run: scripts/micro-ceph.sh
      - run: npm ci
      - run: npm run build
      - run: npm run test:integration
        env:
          CEPH_INTEGRATION: "1"
          CEPH_CONF: /tmp/node-librados-ceph/ceph.conf
      - name: Cluster logs
        if: failure()
        run: tail -n 200 /tmp/node-librados-ceph/log/*.log

  newest-compiler:
    # the newest GCC catches missing standard library includes that older releases pull in indirectly
    runs-on: ubuntu-24.04
    container:
      image: gcc:15
    steps:
      - uses: actions/checkout@v4
      - name: Install Ceph client headers and Node-API headers
        run: apt-get update && apt-get install -y librados-dev librbd-dev libnode-dev npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Compile every source file with GCC 15
        run: |
          g++ --version | head -1
          for source in src/*.cpp; do
            g++ -std=c++17 -Wall -Wextra -Wpedantic -fsyntax-only \
              -DNAPI_VERSION=9 -DNODE_ADDON_API_CPP_EXCEPTIONS_ALL \
              -I/usr/include/node -Inode_modules/node-addon-api "$source"
          done

  package:
    needs: [build, integration, newest-compiler]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npm run build:ts
      - uses: actions/download-artifact@v4
        with:
          name: addon-squid-x64
          path: bin/x86_64-linux-gnu
      - uses: actions/download-artifact@v4
        with:
          name: addon-squid-arm64
          path: bin/aarch64-linux-gnu
      - run: npm pack
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: node-librados-*.tgz
      - name: Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm install -g npm@latest
          npx semantic-release
