name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        node: [22, 24]
        ceph: [squid, tentacle]
        arch: [x64, arm64]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-22.04' }}
    container:
      image: ubuntu:22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Node and Ceph client headers
        run: |
          apt-get update && apt-get install -y ca-certificates curl gnupg g++ make python3
          mkdir -p /etc/apt/keyrings
          curl -fsSL https://download.ceph.com/keys/release.asc | gpg --dearmor -o /etc/apt/keyrings/ceph.gpg
          echo "deb [signed-by=/etc/apt/keyrings/ceph.gpg] https://download.ceph.com/debian-${{ matrix.ceph }}/ jammy main" > /etc/apt/sources.list.d/ceph.list
          curl -fsSL https://deb.nodesource.com/setup_${{ matrix.node }}.x | bash -
          apt-get update && apt-get install -y nodejs librados-dev librbd-dev
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run coverage:api
      - uses: actions/upload-artifact@v4
        if: matrix.node == 24
        with:
          name: addon-${{ matrix.ceph }}-${{ matrix.arch }}
          path: build/Release/node-librados.node

  package:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npm run build:ts
      - uses: actions/download-artifact@v4
        with:
          name: addon-squid-x64
          path: bin/x86_64-linux-gnu
      - uses: actions/download-artifact@v4
        with:
          name: addon-squid-arm64
          path: bin/aarch64-linux-gnu
      - run: npm pack
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: node-librados-*.tgz
